<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Camera Survey Form</title>
    <meta name="description" content="Survey form for XYZ Camera users to provide feedback and suggestions.">
    <meta name="keywords" content="XYZ Camera, survey, feedback, user experience">
    <meta name="author" content="XYZ Camera Team">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div>
    <div class="form-container">
        <header>
            <h1 id="title">XYZ Camera Survey Form</h1>
            <p id="description">Please fill out the form below to help us improve our services.</p>
        </header>
        <form class="form" id="survey-form">
            <div class="form-group">
                <label for="name" id="name-label">Name</label>
                <input type="text" id="name"placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email" id="email-label">Email</label>
                <input type="email" id="email"placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="number" id="number-label">Age</label>
                <input type="number" id="number" min=15 max=100 placeholder="Enter your age" required>
            </div>
            <div class="form-group">
                <label for="dropdown">Which option describes your current role?</label>
                <select name="role" id="dropdown">
                    <option value="student">Student</option>
                    <option value="professional">Professional</option>
                    <option value="hobbyist">Hobbyist</option>
                </select>
            </div>
            <div class="form-group">
                <label for="recommend">Would you recommend XYZ Camera to a friend?</label>
                <label for="recommend-yes">
                    <input type="radio" id="recommend-yes" name="recommend" value="yes" checked>
                    Yes
                </label>
                <label for="recommend-no">
                    <input type="radio" id="recommend-no" name="recommend" value="no">
                    No
                </label>
                <label for="recommend-maybe">
                    <input type="radio" id="recommend-maybe" name="recommend" value="maybe">
                    Maybe
                </label>
            </div>
            <div class="form-group">
                <label for="fav-feature">
                    What is your favorite feature of the XYZ Camera?
                </label>
                <select name="fav-feature" id="fav-feature">
                    <option value="image-quality">Image Quality</option>
                    <option value="ease-of-use">Ease Of Use</option>
                    <option value="battery-life">Battery Life</option>
                    <option value="customer-support">Customer Support</option>
                    <option value="price">Price</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="whatToImprove">What would you like us to see improved?</label>
                <label for="whatToImprove"><input type="checkbox" id="whatToImprove" name="whatToImprove" value="build-quality">Build Quality</label>
                <label for="whatToImprove"><input type="checkbox" id="whatToImprove" name="whatToImprove" value="software-features">Software Features</label>
                <label for="whatToImprove"><input type="checkbox" id="whatToImprove" name="whatToImprove" value="customer-support">Customer Support</label>
                <label for="whatToImprove"><input type="checkbox" id="whatToImprove" name="whatToImprove" value="battery-life">Battery Life</label>
            </div>
            <div class="form-group">
                <label for="suggestions">Any other suggestions?</label>
                <textarea name="suggestions" id="suggestions" rows="4" placeholder="Share your thoughts here..."></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="submit-button" id="submit">Submit</button>
        </form>
    </div>
</body>
</html>
